name: gitops-ci
on:
  push:
    branches: [main]
    paths: [app/**]

permissions:
  contents: write
  packages: write

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/telemetry:${{ github.sha }} ./app
          docker push ghcr.io/${{ github.repository_owner }}/telemetry:${{ github.sha }}

      - name: Update image tag
        run: |
          sed -i "s|image: ghcr.io/.*/telemetry:.*|image: ghcr.io/${{ github.repository_owner }}/telemetry:${{ github.sha }}|" infra/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add infra/deployment.yaml
          git commit -m "chore: bump image tag to ${{ github.sha }}" || true
          git push