apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vika16-7/smarthome-gitops.git
    targetRevision: main
    path: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops36
  syncPolicy:
    automated:
      prune: true
      selfHeal: true