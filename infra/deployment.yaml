apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
  labels:
    app: telemetry
    org.bstu.course: RSIOT
    org.bstu.variant: "36"
    org.bstu.slug: "230252-v36"
spec:
  replicas: 5
  selector:
    matchLabels:
      app: telemetry
  template:
    metadata:
      labels:
        app: telemetry
    spec:
      containers:
        - name: telemetry
          image: ghcr.io/vika16-7/telemetry:ed9441491c2fd39db4f8a6c7948c93b9d84d6d88
          ports:
            - containerPort: 8116
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8116
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8116
            initialDelaySeconds: 10
            periodSeconds: 10